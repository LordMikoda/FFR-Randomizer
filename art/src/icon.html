<!doctype html><html><head><meta charset="utf-8"><title>FFR Randomizer icon</title>
<style>*{margin:0}html,body{background:transparent}img{display:block}</style>
<script src="crystal.js"></script></head><body><script>
// Renders the app icon (crystal on a menu-window tile) at ?size= pixels.
const n=+new URLSearchParams(location.search).get('size')||512;
const img=document.createElement('img');img.width=n;img.height=n;img.id='icon';
img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(crystalSVG({bg:1}));
document.body.appendChild(img);
</script></body></html>
